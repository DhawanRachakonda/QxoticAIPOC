spring.application.name=QxoticAI

# Model loading
# false = resolve models from Hugging Face (downloaded to the local cache on first use)
# true  = load GGUF files from qxotic.models-dir only; never touches the network
qxotic.local=true
qxotic.models-dir=models

# Chat model: Hugging Face ref (local=false) / file under models-dir (local=true)
qxotic.chat.model=LiquidAI/LFM2.5-230M-GGUF
qxotic.chat.file=LFM2.5-230M-Q4_K_M.gguf

# Text-to-speech model + voice
qxotic.tts.model=simonfxr/kokoro.cpp-GGUF:Q8_0
qxotic.tts.file=kokoro-82m-q8_0.gguf
qxotic.tts.voice=simonfxr/kokoro.cpp-GGUF/voices/kokoro-voice-af_heart.gguf
qxotic.tts.voice-file=voices/kokoro-voice-af_heart.gguf
